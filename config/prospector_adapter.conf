# Prospector Dongle Configuration
# Display and sensor settings for the Prospector ZMK Module

# Disable ambient light sensor (kein Sensor vorhanden)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n

# Set fixed display brightness (1-100, ohne Sensor)
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Rotate the display 180 degrees if needed
# CONFIG_PROSPECTOR_PROSPECTOR_ROTATE_DISPLAY_180=n

# Convert layer names to all caps in layer roller
# CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=n

# Battery widget configuration
# Shows battery status for both peripheral halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

