# Prospector dongle (ZMK main, new status screens)
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Kein Lichtsensor vorhanden -> feste Helligkeit (1-100)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=n
CONFIG_PROSPECTOR_MODIFIER_ORDER="GCAS"
# CONFIG_PROSPECTOR_SHOW_MODIFIERS=n

CONFIG_PROSPECTOR_ANIMATION_WPM_REFERENCE=95
CONFIG_PROSPECTOR_ANIMATION_INTENSITY_DECAY_SEC=45

# Batterie beider Hälften am Dongle anzeigen
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
